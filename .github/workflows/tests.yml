name: Tests without proprietary font
on: [push, pull_request]
permissions:
  contents: read
jobs:
  core:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pip install -e .
      - run: python -m pytest tests/test_importers.py tests/test_batch.py tests/test_storage.py tests/test_validation.py tests/test_packaging.py -k "not bundled_font" -q
